name: Popn Music Scraper

on:
  schedule:
    # 한국 시간(KST) 매주 금요일 00시 00분은 UTC 시간으로 목요일 15시 00분입니다.
    # 분 시간 일 월 요일 (0=일요일, 4=목요일)
    - cron: '0 15 * * 4'
  workflow_dispatch: # 웹에서 수동으로 실행할 수 있는 버튼 활성화

permissions:
  contents: write # 봇이 레포지토리에 파일을 푸시할 수 있도록 쓰기 권한 부여

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: 레포지토리 체크아웃
      uses: actions/checkout@v4

    - name: 파이썬 3.10 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 필수 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 크롤러 파이썬 스크립트 실행
      run: |
        # 실제 파이썬 파일의 경로에 맞게 이름을 수정하세요.
        python popn_homepage_scraper/scraper.py 

    - name: 크롤링 결과물(CSV, 이미지 폴더) 커밋 및 푸시
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 새로 생성되거나 변경된 모든 파일 추가
        git add .
        
        # 변경 사항이 있을 때만 커밋하고 푸시 (에러 방지)
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated scrape update" && git push)